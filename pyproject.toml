[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sei-cbm"
version = "0.1.0"
description = "MCP (Model Context Protocol) Server para o SEI (Sistema Eletrônico de Informações)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.3.0,<2.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "lxml>=5.0.0",
]

[project.scripts]
mcp-sei = "src.server:main"
